name: Test install

on:
  push:
  pull_request:

jobs:
  install:
    env:
      GITHUB_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - name: Create canonical checkout
        run: |
          mkdir -p "$HOME/.local/share"
          git clone "$GITHUB_WORKSPACE/source" "$HOME/.local/share/etc"
      - name: Install
        run: "$HOME/.local/share/etc/install.sh"
      - name: Reinstall
        run: "$HOME/.local/share/etc/install.sh"
      - name: Validate
        run: |
          test ! -e /etc/mise
          test "$(readlink "$HOME/.config/mise/mise.lock")" = "$HOME/.local/share/etc/home/.config/mise/mise.lock"
          "$HOME/.local/bin/mise" bootstrap status --missing
          bash -lc 'command -v mise'
          bash -ic 'test "$MISE_SHELL" = bash && test "$XDG_CONFIG_HOME" = "$HOME/.config"'
          zsh_bin=$("$HOME/.local/bin/mise" which zsh)
          "$zsh_bin" -ic 'test "$MISE_SHELL" = zsh && test "$XDG_CONFIG_HOME" = "$HOME/.config"'
          fish_bin=$("$HOME/.local/bin/mise" which fish)
          "$fish_bin" -ic 'test "$MISE_SHELL" = fish; and test "$XDG_CONFIG_HOME" = "$HOME/.config"'
          nu_bin=$("$HOME/.local/bin/mise" which nu)
          XDG_CONFIG_HOME="$HOME/.config" "$nu_bin" --config "$HOME/.config/nushell/autoload/00-mise.nu" -c \
            'if $env.MISE_SHELL != "nu" or $env.XDG_CONFIG_HOME != ($env.HOME | path join .config) { exit 1 }'
